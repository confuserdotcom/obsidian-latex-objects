<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <!-- the selection a text object makes: inside the braces -->
  <rect x="80" y="78" width="96" height="100" rx="12" fill="url(#sel)"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" fill="#ede9fe">
    <text x="30" y="176" font-size="148">{</text>
    <text x="168" y="176" font-size="148">}</text>
  </g>
  <g font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif" font-style="italic" fill="#ffffff">
    <text x="94" y="158" font-size="82">x</text>
    <text x="136" y="118" font-size="44">n</text>
  </g>
  <!-- Vim block cursor -->
  <rect x="156" y="132" width="12" height="32" rx="2" fill="#f5d0fe"/>
</svg>
